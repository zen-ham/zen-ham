# Daily jobs for the profile.
#
# Both jobs fire on:
#   - pipeline schedule (set up via gitlab API or Settings -> CI/CD -> Schedules)
#   - manual web trigger (for ad-hoc re-runs)
#   - api trigger, i.e. POST /projects/:id/pipeline (scriptable re-runs, lets you pass
#     one-off variables like ROTATE_MIRRORS without editing the schedule)
# NOT on regular master push (to avoid commit loops).
#
# REQUIRED CI/CD VARIABLES (set at gitlab.com/zenham/zenham/-/settings/ci_cd -> Variables):
#
#   WIDGETS_TOKEN   gitlab PAT, scopes: api + read_repository + write_repository
#                   used by both generate_widgets and mirror_reconcile
#   GH_MIRROR_TOKEN github PAT, scopes: repo + delete_repo
#                   used by mirror_reconcile; embedded in every push-mirror URL
#
# Both flagged Protected off, Masked on, Hidden on.
#
# OPTIONAL RUN-TIME VARIABLE (add on the "Run pipeline" page, not stored in settings):
#
#   ROTATE_MIRRORS=1  makes mirror_reconcile delete + recreate every github push mirror
#                     so each URL picks up the current GH_MIRROR_TOKEN. Run once after
#                     rotating that PAT. See MIRRORING.md -> "Rotating GH_MIRROR_TOKEN".
#
# Full mirroring architecture: MIRRORING.md at repo root.

generate_widgets:
  image: python:3.12-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git >/dev/null
  variables:
    GITLAB_USERNAME: "zenham"
  script:
    - GITLAB_TOKEN="$WIDGETS_TOKEN" OUT_DIR=assets/widgets python assets/make_widgets.py
    - git config user.email "ci@gitlab.com"
    - git config user.name "GitLab CI Widgets"
    - git add assets/widgets/
    - |
      if git diff --cached --quiet; then
        echo "no widget changes; skipping commit"
      else
        git commit -m "ci: regenerate widgets [skip ci]"
        git push "https://oauth2:${WIDGETS_TOKEN}@gitlab.com/zenham/zenham.git" HEAD:master
      fi
  artifacts:
    paths:
      - assets/widgets/
    expire_in: 7 days

mirror_reconcile:
  image: python:3.12-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates >/dev/null
  script:
    - GITLAB_TOKEN="$WIDGETS_TOKEN" GH_TOKEN="$GH_MIRROR_TOKEN" python assets/mirror_reconcile.py
